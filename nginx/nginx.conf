events { worker_connections 1024; }

http {
    # ── SERVER FOR PORT 80 (APIs & MongoDB Showcase) ──
    server {
        listen 80;

        # 1. Main Posts Service API Gateway
        location /api {
            proxy_pass http://posts-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Notification Health Check Route
        location /api/notification/healthy {
            proxy_pass http://notification-service:4000/api/notification/healthy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Read-Only MongoDB Database View Showcase
        location /mongo-view {
            # Block modifications at the Nginx level entirely
            if ($request_method !~ ^(GET|HEAD)$ ) {
                return 403;
            }
            
            proxy_pass http://mongo:27017/;
            proxy_set_header Host $host;
        }
    }

    # ── SERVER FOR PORT 8080 (Kafka UI Showcase) ──
    server {
        listen 8080;

        location / {
            proxy_pass http://kafka-ui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}